# Serves the LEGEZT PHP dashboard on port 80; install by copying this file to /etc/nginx/sites-available/legezt.
# Loaded by nginx through a symlink in /etc/nginx/sites-enabled; remove the default site, run nginx -t, then systemctl reload nginx.
# Requires nginx 1.18+, PHP 8.2 FPM at /run/php/php8.2-fpm.sock, and the LEGEZT public web root.

server {
    listen 80 default_server;
    server_name _;

    root /home/ubuntu/levanter-qr-session/php-dashboard/public;
    index index.php;
    client_max_body_size 16M;

    access_log /var/log/nginx/legezt.access.log;
    error_log /var/log/nginx/legezt.error.log;

    location = /health {
        rewrite ^ /health.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
